[project]
name = "resume-job-matcher"
version = "0.1.0"
description = "Resume Job Matcher - AI-powered resume analysis and job matching"
readme = "readme.md"
requires-python = ">=3.8"
dependencies = [
    "PyPDF2==3.0.1",
    "anthropic==0.3.11",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "tqdm==4.66.1",
    "termcolor==2.3.0",
    "json5==0.9.14",
    "requests==2.31.0",
    "beautifulsoup4==4.12.2",
    "python-dotenv>=1.0.0",
    "markdown>=3.0.0",
    "weasyprint>=60.0",
    "pdfkit>=1.0.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-mock>=3.0.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]